# core-route53: plan on pull request, apply on merge to main (push to main) or manual run on main.
name: core-route53

on:
  pull_request:
    paths:
      - "core-route53/**"
      - ".github/workflows/core-route53.yml"
      - ".github/workflows/terraform-project.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "core-route53/**"
      - ".github/workflows/core-route53.yml"
      - ".github/workflows/terraform-project.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: core-route53-${{ github.event_name == 'pull_request' && github.ref || 'apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    uses: ./.github/workflows/terraform-project.yml
    with:
      project: core-route53
      mode: ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
