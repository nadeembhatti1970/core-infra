# core-acm: plan on non-main branch pushes; apply on main pushes or manual runs on main.
name: core-acm

on:
  push:
    branches: ["**"]
    paths:
      - "core-acm/**"
      - ".github/workflows/core-acm.yml"
      - ".github/workflows/terraform-project.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: core-acm-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  terraform:
    uses: ./.github/workflows/terraform-project.yml
    with:
      project: core-acm
      mode: ${{ github.ref == 'refs/heads/main' && 'apply' || 'plan' }}
      upstream_state_keys: route53/dev/terraform.tfstate
      upstream_workflows: core-route53.yml
