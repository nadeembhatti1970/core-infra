# core-vpc: plan on pull request, apply on merge to main (push to main) or manual run on main.
name: core-vpc

on:
  pull_request:
    paths:
      - "core-vpc/**"
      - ".github/workflows/core-vpc.yml"
      - ".github/workflows/terraform-project.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "core-vpc/**"
      - ".github/workflows/core-vpc.yml"
      - ".github/workflows/terraform-project.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: core-vpc-${{ github.event_name == 'pull_request' && github.ref || 'apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    uses: ./.github/workflows/terraform-project.yml
    with:
      project: core-vpc
      mode: ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
