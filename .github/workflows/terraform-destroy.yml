# Reusable: destroy one Terraform project (used by the scheduled teardown).
# Skips projects whose state is already empty.
name: terraform-destroy

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: 1.16.5
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: destroy ${{ inputs.project }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-destroy-${{ inputs.project }}-${{ github.run_id }}
          role-duration-seconds: 7200

      - name: terraform init
        run: terraform init

      - name: Check state
        id: state
        run: |
          if [ -z "$(terraform state list)" ]; then
            echo "::notice::${{ inputs.project }} state is empty; nothing to destroy"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: terraform destroy
        if: steps.state.outputs.empty != 'true'
        run: terraform destroy -auto-approve -lock-timeout=10m
